name: pipeline

# 错峰调度（cron 为 UTC）：
#   07:35 UTC = 15:35 CST  A股盘后日结
#   22:05 UTC ≈ 美股盘后    刷新 CNN Fear & Greed
# 工作日运行；每次成功会 commit index.json，天然规避「公开仓库 60 天无活动自动禁用」。
on:
  schedule:
    - cron: "35 7 * * 1-5"
    - cron: "5 22 * * 1-5"
  workflow_dispatch: {}

# 允许用内置 GITHUB_TOKEN 把产出提交回仓库（接法 A）
permissions:
  contents: write

concurrency:
  group: pipeline
  cancel-in-progress: false

# monorepo：Fear & Greed 为其中一个 app
defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "Fear & Greed/pipeline/requirements.txt"

      - name: Install deps
        run: pip install -r "Fear & Greed/pipeline/requirements.txt"

      - name: Run pipeline (incremental)
        working-directory: "Fear & Greed/pipeline"
        run: python -u main.py

      - name: Commit outputs
        run: |
          git config user.name "pipeline-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Fear & Greed/pipeline/out/index.json" "Fear & Greed/pipeline/data/factors.db"
          if git diff --staged --quiet; then
            echo "无变更，跳过提交"
          else
            git commit -m "data: 自动更新 index.json [skip ci]"
            git push
          fi
